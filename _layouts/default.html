<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} – {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"><link rel="alternate" type="application/atom+xml" title="RSS" href="{{ '/feed.xml' | relative_url }}"></head><body><header><div class="wrap"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><p>{{ site.description }}</p><nav><a href="{{ '/' | relative_url }}">Forside</a><a href="{{ '/arkiv/' | relative_url }}">Arkiv</a></nav></div></header><main class="wrap">{{ content }}</main><footer class="wrap">© {{ site.time | date: '%Y' }} {{ site.title }}</footer></body></html>
